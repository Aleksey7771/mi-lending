version: '3.9'

services:
  bot:
    build: .
    restart: always
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./pdf/assets:/app/pdf/assets
      - ./generated_pdfs:/app/generated_pdfs
    ports:
      - "8080:8080"

  tg_reader:
    build: ./tg_reader
    restart: always
    env_file: .env
    volumes:
      - ./tg_reader/session:/app/session
    depends_on:
      - postgres
      - redis
    profiles: ["v1_5"]

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  healthcheck:
    image: alpine:latest
    restart: always
    env_file: .env
    command: >
      sh -c "apk add --no-cache wget --quiet &&
        while true; do
          wget -q --spider http://bot:8080/health 2>&1 ||
          wget -q -O- \"https://api.telegram.org/bot$${BOT_TOKEN}/sendMessage?chat_id=$${OWNER_TELEGRAM_ID}&text=%E2%9A%A0%EF%B8%8F+%D0%91%D0%BE%D1%82+%D1%83%D0%BF%D0%B0%D0%BB\";
          sleep 60;
        done"
    depends_on:
      - bot

volumes:
  postgres_data:
  redis_data:
